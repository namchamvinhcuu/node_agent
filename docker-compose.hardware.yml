# Override CHI dung khi trien khai that len Pi/PC-bridge co gan USB-serial
# that (mode: "serial" trong channels.json). Chay:
#   docker compose -f docker-compose.yml -f docker-compose.hardware.yml up
#
# KHONG include file nay khi test/dev bang channels.json toan "mode": "sim"
# - se khong can hardware gi.
#
# Bind-mount CA THU MUC /dev (KHONG liet ke tung `/dev/ttyUSB0` rieng le):
# Compose khong co cu phap "optional device" - neu liet ke cung 1 path co
# dinh, cam cong USB khac (hoac chi co 1 trong nhieu path liet ke) se lam
# `docker compose up` fail CUNG ngay tu luc tao container (da gap that voi
# cach lam cu, xem Fix-History). Bind-mount thu muc thay vi device node cu
# the giai quyet triet de: node_agent khong can biet TRUOC cong nao se duoc
# cam vao - chi can chon dung `port` trong channels.json (qua web UI /setup/
# channels) la dung, ke ca cam SAU khi container da start (device node cu
# the trong `devices:` chi chup nhanh luc tao container, bind-mount thu muc
# thi thay thay doi ngay).
#
# Container van chay non-root (uid 1000, xem Dockerfile) + group_add "20"
# (dialout) - CHI doc/ghi duoc file co quyen nhom dialout (serial/tty), KHONG
# tu nhien truy cap duoc disk/GPU/thiet bi khac trong /dev du thay duong dan
# (permission Linux van ap dung binh thuong, bind-mount chi anh xa namespace
# duong dan, khong doi ownership/mode cua tung file). Nam da duyet mount
# rong nay (2026-09-25) sau khi can nhac voi phuong an hep hon
# (device_cgroup_rules theo major number) - xem Plan/node-agent-setup-web-ui.md.
#
# `device_cgroup_rules` BAT BUOC rieng, KHONG the thay the boi volumes+group_add
# o tren - da verify thuc nghiem tren OrangePi3B that (2026-09-25, cgroup v2):
# bind-mount /dev:/dev CHI lam device node hien ra trong filesystem namespace
# cua container, nhung Docker van ap dung mot LOP KHAC doc lap - cgroup device
# controller - chan open() cac major/minor KHONG nam trong whitelist mac dinh
# (null/zero/tty/ptmx...) BAT KE quyen file Unix (owner/group/mode) co dung
# hay khong. Trieu chung: pyserial raise "SerialException [Errno 1] could not
# open port ...: Operation not permitted" ngay ca khi `ls -la`/`getfacl` tren
# ca host lan container deu cho thay quyen dialout dung. Truoc day trieu
# chung nay bi gan nham cho loi driver PL2303 stall o tang kernel (xem muc
# "Known issue" trong Deploy-Runbook.md) - lan nay dmesg KHONG co dong
# `pl2303_get_line_request failed`, xac nhan day la 2 nguyen nhan KHAC NHAU
# cung ra 1 trieu chung EPERM giong het nhau, de nham lan neu chi doc dmesg
# so luot. `c 188:* rmw` = major 188 la ma LANANA gan cho "USB serial
# converters" (dung chung cho pl2303/ch340/ch341/ftdi_sio/cp210x... - MOI
# driver usbserial deu dang ky duoi major nay voi minor dong), wildcard `*`
# cho phep TAT CA minor duoi major do - giu dung tinh than "cam cong nao
# cung duoc, chon qua channels.json" ma khong can biet truoc device node cu
# the (khac han neu dung `devices:` liet ke tung path).
#
# Build NGAY TREN chinh thiet bi Pi/PC-bridge target (`docker compose up
# --build`) - `build: .` trong docker-compose.yml build theo kien truc may
# dang chay lenh nay. Neu doi sang build tap trung (CI/may dev) roi
# push/transfer image sang Pi, PHAI dung `docker buildx build --platform
# linux/arm64` (hoac linux/arm/v7) khop kien truc Pi that, khong build tran
# tren may dev roi copy image sang - se loi "exec format error".
services:
  node-agent:
    volumes:
      - /dev:/dev
    group_add:
      - "20"  # GID cua nhom "dialout" tren Debian/Ubuntu/Raspberry Pi OS
    device_cgroup_rules:
      - "c 188:* rmw"  # major USB-serial converter - xem giai thich tren
